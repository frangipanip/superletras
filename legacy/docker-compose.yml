services:
  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}