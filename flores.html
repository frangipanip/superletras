<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<title>Flores - Mundo 1</title>
	<link rel="stylesheet" href="src/styles/actividad.css">
	<style>
		body {
			background: url("assets/imagenes/FONDOejerciciosM1.jpg") center / cover no-repeat;
		}

		.flower-activity {
			width: 100vw;
			height: 100vh;
			height: 100dvh;
			overflow: hidden;
		}

		:root {
			--flower-size: 140px;
		}

		.flower-heading {
			position: fixed;
			top: clamp(1rem, 4vh, 2rem);
			left: 50%;
			z-index: 2;
			width: min(92vw, 42rem);
			transform: translateX(-50%);
			text-align: center;
		}

		.flower-heading h1 {
			margin: 0;
			color: #fff;
			font: 700 clamp(1.7rem, 4vmin, 2.8rem) Arial, Helvetica, sans-serif;
			text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
			text-transform: uppercase;
		}

		.flower-heading p {
			margin: 0.4rem 0 0;
			color: #fff;
			font: 700 clamp(1rem, 2.8vmin, 1.8rem) Arial, Helvetica, sans-serif;
			text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
		}

			.target-token {
				display: inline-grid;
				place-items: center;
				min-width: 2.2rem;
				padding: 0.12rem 0.55rem;
				border: 2px solid #fff6a4;
				border-radius: 999px;
				background: rgba(255, 255, 255, 0.35);
			}

			.flower-field {
				position: fixed;
			top: 55%;
				left: 50%;
				display: grid;
				grid-template-columns: repeat(4, var(--flower-size));
				align-items: start;
				justify-items: center;
				gap: clamp(0.5rem, 3vw, 2rem);
				width: min(92vw, 60rem);
				height: calc(100dvh - 12rem);
				max-height: calc(100dvh - 12rem);
				transform: translateX(-50%);
			}

			.flower-button {
				position: relative;
				min-width: 0;
				padding: 0;
				border: 0;
				background: transparent;
				cursor: pointer;
				transition: transform 180ms ease, filter 180ms ease;
				width: var(--flower-size);
			}

			.flower-button img {
				display: block;
				width: 100%;
				max-height: calc(100dvh - 12rem);
				height: auto;
				object-fit: contain;
				filter: drop-shadow(0 5px 7px rgba(0, 0, 0, 0.4));
			}

			.flower-label {
				position: absolute;
				bottom: 8%;
				left: 50%;
				display: grid;
				place-items: center;
				min-width: clamp(2rem, 5vmin, 2.6rem);
				min-height: clamp(2rem, 5vmin, 2.6rem);
				padding: 0.15rem 0.45rem;
				border: 3px solid #fff;
				border-radius: 50%;
				background: rgba(255, 242, 196, 0.96);
				box-shadow: 0 3px 7px rgba(0, 0, 0, 0.4);
				color: #65352a;
				font: 800 clamp(0.8rem, 2.2vmin, 1.35rem) Arial, Helvetica, sans-serif;
				transform: translateX(-50%);
			}

			.flower-button:hover,
			.flower-button:focus-visible {
				transform: translateY(-5px) scale(1.04);
				filter: brightness(1.08);
			}

			.flower-button.correct img {
				filter: drop-shadow(0 0 10px rgba(133, 237, 150, 1));
			}

			.flower-button.wrong img {
				filter: drop-shadow(0 0 10px rgba(235, 86, 86, 0.95));
			}

			@media (max-width: 768px) and (orientation: landscape) {
				.flower-field {
					top: 48%;
					width: min(94vw, 48rem);
					grid-template-columns: repeat(4, var(--flower-size));
					gap: clamp(0.35rem, 2vw, 0.9rem);
					max-height: calc(100dvh - 8rem);
					height: calc(100dvh - 11rem);
				}

				.flower-button img {
					max-height: calc(100dvh - 8rem);
				}
			}

			@media (max-width: 600px) and (orientation: portrait) {
				.flower-field {
					top: 29%;
					grid-template-columns: repeat(2, var(--flower-size));
					gap: clamp(0.5rem, 3vw, 1rem);
					width: min(86vw, 28rem);
					max-height: calc(100dvh - 11rem);
				}

				.flower-button img {
					max-height: calc((100dvh - 13rem) / 2);
				}
			}
	</style>
</head>
<body>
	<button class="corner-button" type="button" aria-label="Volver"><img src="assets/imagenes/volverbtn.png" alt="Volver"></button>
	<button class="fullscreen-button" id="fullscreen-button" type="button" aria-label="Pantalla completa">⛶</button>
	<div class="activity-controls" aria-label="Controles de actividad">
		<button class="restart-button" id="restart-button" type="button" aria-label="Reiniciar actividad">&#x21bb; Reiniciar</button>
	</div>
	<main class="flower-activity">
		<section class="flower-heading">
			<h1>Flores</h1>
			<p id="instruction">Pulsa <span class="target-token" id="target-token">A</span></p>
		</section>
		<section class="flower-field" id="flower-field" aria-label="Flores"></section>
	</main>
	<button class="selected-character" id="selected-character" type="button" aria-label="Personaje" hidden>
		<img id="selected-character-image" alt="">
	</button>
	<script src="src/scripts/actividad.js"></script>
	<script>
		const selectedOption = (localStorage.getItem("superletras-mundo1-menu-option") || "a").toLowerCase();
		const isLetterMode = selectedOption === "l";
		const field = document.querySelector("#flower-field");
		const targetToken = document.querySelector("#target-token");
		const restartButton = document.querySelector("#restart-button");
		const vowels = ["A", "E", "I", "O", "U"];
		const lSyllables = ["LA", "LE", "LI", "LO", "LU"];
		const mSyllables = ["MA", "ME", "MI", "MO", "MU"];
		const flowerImages = ["assets/imagenes/FLOR.svg", "assets/imagenes/FLOR1.svg"];
		const instructionAudio = new Audio("assets/sonidos/Pulsa.m4a");
		let optionAudio;
		let feedbackAudio;
		let targetValue;

		function shuffle(items) {
			const copy = [...items];
			for (let index = copy.length - 1; index > 0; index -= 1) {
				const randomIndex = Math.floor(Math.random() * (index + 1));
				[copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
			}
			return copy;
		}

		function stopAudio(audio) {
			if (!audio) {
				return;
			}
			audio.pause();
			audio.currentTime = 0;
			audio.onended = null;
		}

		function audioPath(label) {
			return isLetterMode ? `assets/sonidos/${label.toLowerCase()}.wav` : `assets/sonidos/${label}.wav`;
		}

		function updateFlowerSize() {
			const isPortrait = window.matchMedia("(max-width: 600px) and (orientation: portrait)").matches;
			const columns = isPortrait ? 2 : 4;
			const rows = isPortrait ? 2 : 1;
			const fieldStyles = getComputedStyle(field);
			const columnGap = parseFloat(fieldStyles.columnGap) || 0;
			const rowGap = parseFloat(fieldStyles.rowGap) || 0;
			const bounds = field.getBoundingClientRect();
			const svgHeightRatio = 2279 / 1975;
			const maxByWidth = (bounds.width - columnGap * (columns - 1)) / (isPortrait ? 2.4 : 5);
			const maxByHeight = (bounds.height - rowGap * (rows - 1)) / (rows * 1.3 * svgHeightRatio);
			const mobileLandscape = window.matchMedia("(max-width: 768px) and (orientation: landscape)").matches;
			const maxSize = isPortrait ? 180 : mobileLandscape ? 180 : 260;
			const preferred = Math.min(maxByWidth, maxByHeight, maxSize);
			const size = Math.max(mobileLandscape || isPortrait ? 48 : 64, preferred);
			document.documentElement.style.setProperty("--flower-size", `${size}px`);
		}

		function playInstruction() {
			stopAudio(instructionAudio);
			stopAudio(optionAudio);
			optionAudio = new Audio(audioPath(targetValue));
			instructionAudio.onended = () => optionAudio.play().catch(() => {});
			instructionAudio.play().catch(() => {});
		}

		function playLabelAudio(label, onEnded) {
			stopAudio(instructionAudio);
			stopAudio(optionAudio);
			stopAudio(feedbackAudio);
			const audio = new Audio(audioPath(label));
			audio.onended = onEnded;
			audio.play().catch(() => onEnded?.());
		}

		function buildFlowers() {
			targetValue = isLetterMode ? shuffle(lSyllables)[0] : shuffle(vowels)[0];
			const incorrect = isLetterMode
				? [
					shuffle(lSyllables.filter((item) => item !== targetValue))[0],
					...shuffle(mSyllables).slice(0, 2)
				]
				: shuffle(vowels.filter((item) => item !== targetValue)).slice(0, 3);
			const labels = shuffle([targetValue, ...incorrect]);
			targetToken.textContent = targetValue;
			field.replaceChildren();

			labels.forEach((label, index) => {
				const button = document.createElement("button");
				button.type = "button";
				button.className = "flower-button";
				button.dataset.value = label;
				button.dataset.correct = String(label === targetValue);
				const image = document.createElement("img");
				image.src = flowerImages[index % flowerImages.length];
				image.alt = `Flor con ${label}`;
				const labelElement = document.createElement("span");
				labelElement.className = "flower-label";
				labelElement.textContent = label;
				button.append(image, labelElement);
				button.addEventListener("click", () => handleFlowerClick(button));
				field.appendChild(button);
			});
			playInstruction();
		}

		function handleFlowerClick(button) {
			const isCorrect = button.dataset.correct === "true";
			playLabelAudio(button.dataset.value, () => {
				stopAudio(feedbackAudio);
				feedbackAudio = new Audio(isCorrect ? "assets/sonidos/correcto.mp3" : "assets/sonidos/error.mp3");
				feedbackAudio.play().catch(() => {});
			});
			button.classList.toggle("correct", isCorrect);
			button.classList.toggle("wrong", !isCorrect);
		}

		restartButton.addEventListener("click", buildFlowers);
		window.addEventListener("resize", updateFlowerSize);
		window.addEventListener("orientationchange", updateFlowerSize);
		buildFlowers();
		updateFlowerSize();
	</script>
</body>
</html>
