<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<title>Tren - Mundo 1</title>
	<link rel="stylesheet" href="src/styles/actividad.css">
</head>
<body>
	<button class="corner-button" type="button" aria-label="Volver"><img src="assets/imagenes/volverbtn.png" alt="Volver"></button>
	<button class="fullscreen-button" id="fullscreen-button" type="button" aria-label="Pantalla completa">⛶</button>
	<div class="activity-controls" aria-label="Controles de actividad">
		<button class="case-button" id="case-button" type="button" aria-label="Cambiar a minúsculas" aria-pressed="false">A</button>
		<button class="restart-button" id="restart-button" type="button" aria-label="Reiniciar actividad">&#x21bb; Reiniciar</button>
	</div>
	<main class="train-activity" aria-live="polite">
		<div class="activity-heading">
			<h1 class="activity-title">Completa la secuencia</h1>
			<p class="round-counter" id="round-counter">1 / 5</p>
		</div>
		<section class="sequence-board" id="sequence-board" aria-label="Secuencia de vocales"></section>
		<section class="train-yard" aria-label="Vagones con vocales">
			<div class="train-convoy" id="train-convoy"></div>
		</section>
	</main>
	<button class="selected-character" id="selected-character" type="button" aria-label="Escuchar al personaje" hidden>
		<img id="selected-character-image" alt="">
		<img class="character-mouth" id="character-mouth" src="assets/imagenes/bocasuper.png" alt="" hidden>
	</button>
	<script src="src/scripts/actividad.js"></script>
	<script>
		const selectedMenuOption = (localStorage.getItem("superletras-mundo1-menu-option") || "a").toLowerCase();
		const activityConfig = {
			a: {
				sequences: ["OE", "EA", "AA", "OIA", "UAU"],
				vowelPool: ["A", "E", "I", "O", "U"],
				sequenceTokens: {},
				extraOptions: ["A", "E", "I", "O", "U"],
				speechAudios: {
					vagones: new Audio("assets/sonidos/Vagones.m4a"),
					OE: new Audio("assets/sonidos/Oe.m4a"),
					EA: new Audio("assets/sonidos/Ea.m4a"),
					AA: new Audio("assets/sonidos/Aa.m4a"),
					OIA: new Audio("assets/sonidos/Oia.m4a"),
					UAU: new Audio("assets/sonidos/Uau.m4a"),
					fabuloso: new Audio("assets/sonidos/Fabuloso.m4a")
				}
			},
			l: {
				sequences: ["lola", "lula", "ola", "ala", "lio", "lee", "lila"],
				vowelPool: ["A", "E", "I", "O", "U"],
				sequenceTokens: {
					lola: ["LO", "LA"],
					lula: ["LU", "LA"],
					ola: ["O", "LA"],
					ala: ["A", "LA"],
					lio: ["LI", "O"],
					lee: ["LE", "E"],
					lila: ["LI", "LA"]
				},
				extraOptions: ["A", "E", "I", "O", "U", "LA", "LE", "LI", "LO", "LU"],
				speechAudios: {
					vagones: new Audio("assets/sonidos/Vagones.m4a"),
					lola: new Audio("assets/sonidos/lola.m4a"),
					lula: new Audio("assets/sonidos/lula.m4a"),
					ola: new Audio("assets/sonidos/ola.m4a"),
					ala: new Audio("assets/sonidos/ala.m4a"),
					lio: new Audio("assets/sonidos/lio.m4a"),
					lee: new Audio("assets/sonidos/lee.m4a"),
					lila: new Audio("assets/sonidos/lila.m4a"),
					fabuloso: new Audio("assets/sonidos/Fabuloso.m4a")
				}
			}
		};
		const config = activityConfig[selectedMenuOption] || activityConfig.a;
		const sequences = config.sequences;
		let sequenceOrder = [...sequences];
		const vowels = config.vowelPool || ["A", "E", "I", "O", "U"];
		const extraOptions = config.extraOptions || vowels;
		const wagonImages = ["vagon1.svg", "vagon2.svg", "vagon3.svg", "vagon4.svg"];
		const sequenceBoard = document.querySelector("#sequence-board");
		const trainConvoy = document.querySelector("#train-convoy");
		const roundCounter = document.querySelector("#round-counter");
		const character = document.querySelector("#selected-character");
		const caseButton = document.querySelector("#case-button");
		const restartButton = document.querySelector("#restart-button");
		const characterMouth = document.querySelector("#character-mouth");
		const mouthImages = [
			"assets/imagenes/bocasuper.png",
			"assets/imagenes/bocasuper1.png",
			"assets/imagenes/bocasuper2.png"
		];
		const speechAudios = config.speechAudios;
		let mouthAnimationTimer;
		let activeSpeechAudio;
		let roundIndex = 0;
		let completedSlots = 0;
		let currentSequence = "";
		let draggingToken = null;
		let draggingPlaceholder = null;
		let activityFinished = false;
		let uppercaseLetters = true;

		Object.values(speechAudios).forEach((audio) => {
			audio.preload = "auto";
		});

		function stopSpeech() {
			if (activeSpeechAudio) {
				activeSpeechAudio.pause();
				activeSpeechAudio.currentTime = 0;
				activeSpeechAudio.onended = null;
			}
			activeSpeechAudio = null;
			clearInterval(mouthAnimationTimer);
			characterMouth.hidden = true;
			characterMouth.classList.remove("shifted-mouth");
			character.setAttribute("aria-pressed", "false");
		}

		function speak(audio, onEnded = null) {
			stopSpeech();
			activeSpeechAudio = audio;
			let mouthImageIndex = 0;
			characterMouth.src = mouthImages[mouthImageIndex];
			characterMouth.classList.remove("shifted-mouth");
			characterMouth.hidden = false;
			character.setAttribute("aria-pressed", "true");
			mouthAnimationTimer = window.setInterval(() => {
				mouthImageIndex = (mouthImageIndex + 1) % mouthImages.length;
				characterMouth.src = mouthImages[mouthImageIndex];
				characterMouth.classList.toggle("shifted-mouth", mouthImageIndex > 0);
			}, 220);
			audio.onended = () => {
				stopSpeech();
				onEnded?.();
			};
			audio.currentTime = 0;
			audio.play().catch(stopSpeech);
		}

		function shuffle(items) {
			const shuffled = [...items];
			for (let index = shuffled.length - 1; index > 0; index -= 1) {
				const randomIndex = Math.floor(Math.random() * (index + 1));
				[shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
			}
			return shuffled;
		}

		function getSequenceTokens(sequenceKey) {
			if (selectedMenuOption === "l") {
				return config.sequenceTokens[sequenceKey] || [];
			}
			return Array.from(sequenceKey);
		}

		function renderSequence() {
			sequenceBoard.replaceChildren();
			const tokens = getSequenceTokens(currentSequence);
			tokens.forEach((token, index) => {
				const slot = document.createElement("div");
				slot.className = "sequence-slot";
				slot.classList.toggle("double-token", token.length > 1);
				slot.textContent = uppercaseLetters ? token.toUpperCase() : token.toLowerCase();
				slot.dataset.index = String(index);
				slot.dataset.vowel = token;
				sequenceBoard.appendChild(slot);
			});
		}

		function createToken(tokenValue, index) {
			const token = document.createElement("button");
			token.className = "vowel-token";
			token.type = "button";
			token.textContent = uppercaseLetters ? tokenValue.toUpperCase() : tokenValue.toLowerCase();
			token.dataset.vowel = tokenValue;
			token.classList.toggle("double-token", tokenValue.length > 1);
			token.setAttribute("aria-label", selectedMenuOption === "l" ? `Sílaba ${tokenValue}` : `Vocal ${tokenValue}`);
			token.addEventListener("pointerdown", startDragging);
			return token;
		}

		function createWagon(tokenValue, index) {
			const wagon = document.createElement("div");
			wagon.className = "wagon";
			const image = document.createElement("img");
			image.src = `assets/imagenes/${wagonImages[index % wagonImages.length]}`;
			image.alt = "Vagon";
			image.draggable = false;
			wagon.append(image, createToken(tokenValue, index));
			return wagon;
		}

		function createConvoy() {
			trainConvoy.replaceChildren();
			const tokensForSequence = getSequenceTokens(currentSequence);
			let convoyTokens;
			if (selectedMenuOption === "l") {
				convoyTokens = shuffle([...tokensForSequence, extraOptions[Math.floor(Math.random() * extraOptions.length)]]);
			} else {
				convoyTokens = shuffle([...tokensForSequence, vowels[Math.floor(Math.random() * vowels.length)]]);
			}
			const locomotive = document.createElement("img");
			locomotive.className = "locomotive";
			locomotive.src = "assets/imagenes/tren.svg";
			locomotive.alt = "Locomotora";
			locomotive.draggable = false;
			convoyTokens.forEach((tokenValue, index) => trainConvoy.appendChild(createWagon(tokenValue, index)));
			trainConvoy.appendChild(locomotive);
			trainConvoy.classList.remove("departing");
			void trainConvoy.offsetWidth;
			trainConvoy.classList.add("arriving");
			window.setTimeout(() => trainConvoy.classList.remove("arriving"), 1800);
		}

		function startDragging(event) {
			if (roundIndex >= sequences.length || trainConvoy.classList.contains("departing")) {
				return;
			}
			draggingToken = event.currentTarget;
			const tokenRect = draggingToken.getBoundingClientRect();
			draggingPlaceholder = document.createComment("vocal-placeholder");
			draggingToken.parentNode.insertBefore(draggingPlaceholder, draggingToken);
			document.body.appendChild(draggingToken);
			draggingToken.dataset.pointerOffsetX = String(event.clientX - tokenRect.left);
			draggingToken.dataset.pointerOffsetY = String(event.clientY - tokenRect.top);
			draggingToken.style.width = `${tokenRect.width}px`;
			draggingToken.style.height = `${tokenRect.height}px`;
			draggingToken.style.position = "fixed";
			draggingToken.style.left = `${tokenRect.left}px`;
			draggingToken.style.top = `${tokenRect.top}px`;
			draggingToken.style.transform = "none";
			draggingToken.classList.add("dragging");
			event.preventDefault();
		}

		function dragToken(event) {
			if (!draggingToken) {
				return;
			}
			const offsetX = Number(draggingToken.dataset.pointerOffsetX);
			const offsetY = Number(draggingToken.dataset.pointerOffsetY);
			draggingToken.style.left = `${event.clientX - offsetX}px`;
			draggingToken.style.top = `${event.clientY - offsetY}px`;
		}

		function finishDragging(event) {
			if (!draggingToken) {
				return;
			}
			const token = draggingToken;
			token.classList.remove("dragging");
			draggingPlaceholder.parentNode.insertBefore(token, draggingPlaceholder);
			draggingPlaceholder.remove();
			draggingPlaceholder = null;
			token.style.width = "";
			token.style.height = "";
			token.style.position = "";
			token.style.left = "";
			token.style.top = "";
			token.style.transform = "";
			delete token.dataset.pointerOffsetX;
			delete token.dataset.pointerOffsetY;
			const target = [...document.querySelectorAll(".sequence-slot")].find((slot) => {
				const rect = slot.getBoundingClientRect();
				return event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
			});
			if (target && target.dataset.vowel === token.dataset.vowel && !target.classList.contains("filled")) {
				target.textContent = token.textContent;
				target.classList.add("filled");
				token.disabled = true;
				completedSlots += 1;
				if (completedSlots === getSequenceTokens(currentSequence).length) {
					completeRound();
				}
			}
			draggingToken = null;
		}

		function completeRound() {
			roundIndex += 1;
			trainConvoy.classList.add("departing");
			if (roundIndex === sequences.length) {
				activityFinished = true;
				window.setTimeout(() => {
					trainConvoy.replaceChildren();
					character.hidden = false;
					requestAnimationFrame(() => {
						character.classList.add("celebrating");
						speak(speechAudios.fabuloso);
					});
				}, 1500);
				return;
			}
			window.setTimeout(loadRound, 1500);
		}

		function loadRound(announce = true) {
			currentSequence = sequenceOrder[roundIndex];
			completedSlots = 0;
			roundCounter.textContent = `${roundIndex + 1} / ${sequences.length}`;
			renderSequence();
			createConvoy();
			if (announce) {
				speak(speechAudios[currentSequence]);
			}
		}

		function announceCurrentRound() {
			speak(speechAudios.vagones, () => speak(speechAudios[currentSequence]));
		}

		function restartActivity() {
			const previousSequence = currentSequence;
			stopSpeech();
			activityFinished = false;
			roundIndex = 0;
			completedSlots = 0;
			do {
				sequenceOrder = shuffle(sequences);
			} while (sequenceOrder[0] === previousSequence);
			character.classList.remove("celebrating");
			character.hidden = false;
			trainConvoy.classList.remove("departing");
			loadRound(false);
			announceCurrentRound();
		}

		caseButton.addEventListener("click", () => {
			uppercaseLetters = !uppercaseLetters;
			caseButton.textContent = uppercaseLetters ? "A" : "a";
			caseButton.setAttribute("aria-label", uppercaseLetters ? "Cambiar a minúsculas" : "Cambiar a mayúsculas");
			caseButton.setAttribute("aria-pressed", String(!uppercaseLetters));
			restartActivity();
		});

		character.addEventListener("click", () => {
			if (!activityFinished) {
				speak(speechAudios.vagones);
			}
		});
		restartButton.addEventListener("click", restartActivity);
		loadRound(false);
		window.addEventListener("load", announceCurrentRound, { once: true });
		window.addEventListener("pointermove", dragToken);
		window.addEventListener("pointerup", finishDragging);
		window.addEventListener("pointercancel", finishDragging);
	</script>
</body>
</html>
