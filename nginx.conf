server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# JS/CSS generados por Vite llevan hash en el nombre: se pueden cachear para siempre.
	location /bundle/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# Imagenes y sonidos: se reemplazan con el mismo nombre, así que no se cachean a ciegas.
	# "no-cache" obliga a revalidar (ETag → 304 si no cambió) y evita que Cloudflare
	# o el navegador sigan mostrando la versión vieja después de un deploy.
	location /assets/ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# El mime.types de nginx no trae wav/m4a; Safari necesita el tipo correcto para reproducirlos.
	location /assets/sonidos/ {
		types {
			audio/wav wav;
			audio/mp4 m4a mp4;
			audio/mpeg mp3;
		}
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# index.html nunca se cachea para que un deploy nuevo se vea enseguida.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	# Archivos de la app instalable: tienen nombre fijo y tienen que actualizarse en cada deploy.
	location = /sw.js {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	location = /manifest.json {
		types {
			application/manifest+json json;
		}
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# La app lo consulta para detectar versiones nuevas: nunca se cachea (ni en Cloudflare).
	location = /version.json {
		add_header Cache-Control "no-store";
		try_files $uri =404;
	}

	# API de recompensas (servicio "api" de docker-compose). Con resolver + variable nginx
	# resuelve el nombre en cada pedido: arranca aunque la API todavía no esté levantada.
	location /api/ {
		resolver 127.0.0.11 valid=10s ipv6=off;
		set $api_upstream http://api:3001;
		proxy_pass $api_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		add_header Cache-Control "no-store";
	}

	# SPA: cualquier ruta que no sea un archivo la resuelve React Router.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
