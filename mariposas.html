<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mariposas - Mundo 1</title>
	<link rel="stylesheet" href="src/styles/actividad.css">
	<style>
		body {
			background: url("assets/imagenes/FONDOejerciciosM1.jpg") center / cover no-repeat;
		}

		:root {
			--butterfly-size: clamp(72px, 12vw, 150px);
		}

		.butterfly-activity {
			position: relative;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
		}

		.activity-heading {
			position: fixed;
			top: clamp(1rem, 4vh, 2rem);
			left: 50%;
			z-index: 3;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.4rem;
			transform: translateX(-50%);
		}

		.activity-heading h1 {
			margin: 0;
			color: #fff;
			font: 700 clamp(1.7rem, 4vmin, 2.8rem) Arial, Helvetica, sans-serif;
			text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
			text-transform: uppercase;
		}

		.activity-heading .target-line {
			margin: 0;
			color: #fff;
			font: 700 clamp(1rem, 2.8vmin, 1.8rem) Arial, Helvetica, sans-serif;
			text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
		}

		.activity-heading .target-token {
			display: inline-grid;
			place-items: center;
			min-width: clamp(2rem, 4vw, 3.5rem);
			padding: 0.15rem 0.65rem;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.35);
			border: 2px solid #fff6a4;
			box-shadow: 0 4px 7px rgba(0, 0, 0, 0.24);
		}

		.butterfly-field {
			position: fixed;
			left: 0;
			top: 12%;
			width: 100vw;
			height: 78vh;
			overflow: hidden;
		}

		.butterfly-button {
			position: absolute;
			width: var(--butterfly-size);
			padding: 0;
			border: 0;
			background: transparent;
			cursor: pointer;
			transform: translate(-50%, -50%);
			transition: transform 260ms ease, filter 260ms ease;
		}

		.butterfly-button img {
			display: block;
			width: 100%;
			height: auto;
			filter: drop-shadow(0 4px 7px rgba(0, 0, 0, 0.45));
		}

		.butterfly-button .badge {
			position: absolute;
			top: 70%;
			left: 50%;
			display: grid;
			place-items: center;
			width: clamp(33px, 3.5vw, 43px);
			aspect-ratio: 1;
			border-radius: 50%;
			border: 3px solid #fff;
			background: rgba(255, 242, 196, 0.95);
			box-shadow: 0 3px 7px rgba(0, 0, 0, 0.4);
			color: #65352a;
			font: 800 clamp(0.9rem, 2vmin, 1.3rem) Arial, Helvetica, sans-serif;
			transform: translate(-50%, -50%);
			z-index: 2;
		}

		.butterfly-button .badge {
			text-transform: uppercase;
		}

		.butterfly-button.correct img {
			filter: drop-shadow(0 0 8px rgba(133, 237, 150, 1));
		}

		.butterfly-button.wrong img {
			filter: drop-shadow(0 0 8px rgba(235, 86, 86, 0.9));
		}

		.butterfly-button.correct.flying {
			pointer-events: none;
			animation: fly-away 900ms ease forwards;
		}

		.butterfly-button.wrong.vibration {
			animation: butterfly-vibrate 280ms linear;
		}

		.butterfly-button {
			animation: float-butterfly 1800ms ease-in-out infinite alternate;
		}

		.butterfly-button:nth-child(3n) {
			animation-duration: 2100ms;
		}

		.butterfly-button:nth-child(4n) {
			animation-duration: 1600ms;
		}

		.butterfly-button.correct:not(.flying):hover,
		.butterfly-button.correct:not(.flying):focus-visible {
			transform: translate(-50%, -50%) scale(1.06);
		}

		.nothing {
			display: none;
		}

		@media (max-width: 768px) and (orientation: portrait) {
			.butterfly-field {
				top: 14%;
				height: 76vh;
			}

			.butterfly-button {
				width: clamp(56px, 13vw, 92px);
				min-width: 56px;
			}

			.butterfly-button img {
				width: 100%;
				height: auto;
			}

			.butterfly-button .badge {
				width: clamp(20px, 3vw, 28px);
				font: 800 clamp(0.62rem, 1.8vmin, 0.92rem) Arial, Helvetica, sans-serif;
			}
		}

		@media (max-width: 768px) and (orientation: landscape) {
			:root {
				--butterfly-size: clamp(40px, 7.5vw, 72px);
			}

			.butterfly-field {
				top: 12%;
				height: 86vh;
			}

			.butterfly-button {
				min-width: 42px;
			}

			.butterfly-button img {
				width: 100%;
				height: auto;
			}

			.butterfly-button .badge {
				width: clamp(14px, 2.4vw, 22px);
				font: 800 clamp(0.56rem, 1.4vmin, 0.8rem) Arial, Helvetica, sans-serif;
			}
		}

		@keyframes butterfly-vibrate {
			0% { transform: translate(-50%, -50%) translateX(0); }
			16% { transform: translate(-50%, -50%) translateX(-5px) rotate(-3deg); }
			32% { transform: translate(-50%, -50%) translateX(5px) rotate(3deg); }
			48% { transform: translate(-50%, -50%) translateX(-4px) rotate(-2deg); }
			64% { transform: translate(-50%, -50%) translateX(4px) rotate(2deg); }
			80% { transform: translate(-50%, -50%) translateX(-2px) rotate(-1deg); }
			100% { transform: translate(-50%, -50%) translateX(0); }
		}

		@keyframes float-butterfly {
			from {
				transform: translate(-50%, -50%) translateY(0px) rotate(-4deg);
			}
			to {
				transform: translate(-50%, -50%) translateY(-8px) rotate(4deg);
			}
		}

		@keyframes fly-away {
			0% {
				transform: translate(-50%, -50%) scale(1) rotate(0deg);
				opacity: 1;
			}
			70% {
				opacity: 1;
			}
			100% {
				transform: translate(calc(-50vw - 220px), -120%) scale(0.4) rotate(-20deg);
				opacity: 0;
			}
		}
	</style>
</head>
<body>
	<button class="corner-button" type="button" aria-label="Volver"><img src="assets/imagenes/volverbtn.png" alt="Volver"></button>
	<div class="activity-controls" aria-label="Controles de actividad">
		<button class="restart-button" id="restart-button" type="button" aria-label="Reiniciar actividad">&#x21bb; Reiniciar</button>
	</div>
	<main class="butterfly-activity">
		<section class="activity-heading">
			<h1 id="activity-title">Mariposas</h1>
			<p class="target-line" id="target-line">Pulsar las mariposas con la vocal <span class="target-token" id="target-token">A</span></p>
		</section>
		<section class="butterfly-field" id="butterfly-field" aria-label="Mariposas"></section>
	</main>
	<button class="selected-character" id="selected-character" type="button" aria-label="Personaje" hidden><img id="selected-character-image" alt=""></button>
	<script src="src/scripts/actividad.js"></script>
	<script>
		const selectedOption = (localStorage.getItem("superletras-mundo1-menu-option") || "a").toLowerCase();
		const field = document.querySelector("#butterfly-field");
		const title = document.querySelector("#activity-title");
		const targetLine = document.querySelector("#target-line");
		const targetToken = document.querySelector("#target-token");
		const restartButton = document.querySelector("#restart-button");
		const butterflyImages = [
			"assets/imagenes/MARIPOSA.svg",
			"assets/imagenes/MARIPOSA1.svg",
			"assets/imagenes/MARIPOSA2.svg"
		];
		const vowels = ["A", "E", "I", "O", "U"];
		const syllables = ["LA", "LE", "LI", "LO", "LU", "MA", "ME", "MI", "MO", "MU"];
		const targetVowel = "A";
		const targetSyllable = "LA";
		const totalButterflies = 8;
		let currentMode = selectedOption === "l" ? "l" : "a";
		let targetValue = currentMode === "l" ? targetSyllable : targetVowel;
		let butterflies = [];
		let correctClicked = 0;
		let totalCorrect = 5;

		function shuffle(items) {
			const clone = [...items];
			for (let index = clone.length - 1; index > 0; index -= 1) {
				const randomIndex = Math.floor(Math.random() * (index + 1));
				[clone[index], clone[randomIndex]] = [clone[randomIndex], clone[index]];
			}
			return clone;
		}

		function updateButterflySize() {
			const isMobileLandscape = window.matchMedia("(max-width: 768px) and (orientation: landscape)").matches;
			const bounds = field.getBoundingClientRect();
			const maxByWidth = bounds.width / 7.2;
			const maxByHeight = bounds.height / 3.4;
			const preferred = Math.min(maxByWidth, maxByHeight, isMobileLandscape ? 72 : 150);
			const size = Math.max(isMobileLandscape ? 42 : 64, Math.min(preferred, isMobileLandscape ? 72 : 150));
			document.documentElement.style.setProperty("--butterfly-size", `${size}px`);
		}

		function buildButterflies() {
			field.replaceChildren();
			correctClicked = 0;
			const array = [];
			if (currentMode === "l") {
				title.textContent = "Mariposas";
				targetLine.innerHTML = `Pulsar las mariposas con la sílaba <span class="target-token" id="target-token">${targetValue}</span>`;
				const targetElement = document.querySelector("#target-token");
				targetElement.textContent = targetValue;
				for (let index = 0; index < totalCorrect; index += 1) {
					array.push({ syllable: targetValue, vowel: targetValue[0], image: butterflyImages[index % butterflyImages.length] });
				}
				for (let index = totalCorrect; index < totalButterflies; index += 1) {
					const other = shuffle(syllables.filter((syllable) => syllable !== targetValue))[0];
					array.push({ syllable: other, vowel: other[0], image: butterflyImages[index % butterflyImages.length] });
				}
			} else {
				title.textContent = "Mariposas";
				targetLine.innerHTML = `Pulsar las mariposas con la vocal <span class="target-token" id="target-token">${targetValue}</span>`;
				const targetElement = document.querySelector("#target-token");
				targetElement.textContent = targetValue;
				for (let index = 0; index < totalCorrect; index += 1) {
					array.push({ vowel: targetValue, syllable: targetValue, image: butterflyImages[index % butterflyImages.length] });
				}
				for (let index = totalCorrect; index < totalButterflies; index += 1) {
					const otherVowel = shuffle(vowels.filter((vowel) => vowel !== targetValue))[0];
					array.push({ vowel: otherVowel, syllable: "LA", image: butterflyImages[index % butterflyImages.length] });
				}
			}

			butterflies = shuffle(array);
			const positions = [
				[12, 22], [21, 30], [30, 21], [40, 34], [50, 26], [60, 37], [69, 24], [78, 34], [30, 50], [58, 52]
			];

			butterflies.forEach((butterfly, index) => {
				const btn = document.createElement("button");
				btn.type = "button";
				btn.className = currentMode === "l" ? "butterfly-button l-butterfly" : "butterfly-button a-butterfly";
				btn.dataset.correct = String(currentMode === "l" ? butterfly.syllable === targetValue : butterfly.vowel === targetValue);
				btn.dataset.value = currentMode === "l" ? butterfly.syllable : butterfly.vowel;
				btn.style.left = `${positions[index][0]}vw`;
				btn.style.top = `${positions[index][1]}vh`;
				btn.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 18 - 9}deg)`;
				const img = document.createElement("img");
				img.src = butterfly.image;
				img.alt = currentMode === "l" ? `Mariposa con sílaba ${butterfly.syllable}` : `Mariposa con vocal ${butterfly.vowel}`;
				const badge = document.createElement("span");
				badge.className = "badge";
				badge.textContent = currentMode === "l" ? butterfly.syllable : butterfly.vowel;
				btn.appendChild(img);
				btn.appendChild(badge);
				btn.addEventListener("click", () => handleButterflyClick(btn, butterfly));
				field.appendChild(btn);
			});
		}

		function handleButterflyClick(button, butterfly) {
			const isCorrect = currentMode === "l" ? butterfly.syllable === targetValue : butterfly.vowel === targetValue;
			if (!isCorrect) {
				button.classList.add("vibration");
				button.animate([
					{ transform: "translate(-50%, -50%) translateX(0)" },
					{ transform: "translate(-50%, -50%) translateX(-8px)" },
					{ transform: "translate(-50%, -50%) translateX(8px)" },
					{ transform: "translate(-50%, -50%) translateX(0)" }
				], { duration: 300, iterations: 1 });
				window.setTimeout(() => button.classList.remove("vibration"), 300);
				return;
			}

			correctClicked += 1;
			button.classList.add("flying", "correct");
			button.disabled = true;
			button.animate([
				{ transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
				{ transform: "translate(-50%, -50%) scale(0.7)", opacity: 0.7 },
				{ transform: "translate(-34vw, -60vh) scale(0.2)", opacity: 0 }
			], { duration: 780, iterations: 1, easing: "ease-out" });
			window.setTimeout(() => {
				button.remove();
				if (correctClicked >= totalCorrect) {
					finishRound();
				}
			}, 860);
		}

		function nextTargetValue() {
			const targetPool = currentMode === "l" ? syllables : vowels;
			const currentIndex = targetPool.indexOf(targetValue);
			return targetPool[(currentIndex + 1) % targetPool.length];
		}

		function finishRound() {
			const remaining = Array.from(field.querySelectorAll(".butterfly-button:not(.correct)"));
			remaining.forEach((button) => {
				button.animate([
					{ transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
					{ transform: "translate(-50%, -50%) scale(0.82)", opacity: 0.86 },
					{ transform: "translate(12vw, -12vh) scale(0.2)", opacity: 0 }
				], { duration: 620, iterations: 1, easing: "ease-out" });
				window.setTimeout(() => button.remove(), 640);
			});

			window.setTimeout(() => {
				targetValue = nextTargetValue();
				buildButterflies();
			}, 740);
		}

		restartButton.addEventListener("click", () => {
			buildButterflies();
			updateButterflySize();
		});

		window.addEventListener("resize", updateButterflySize);
		window.addEventListener("orientationchange", updateButterflySize);
		updateButterflySize();
		buildButterflies();
	</script>
</body>
</html>
